<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-label="Kieran - AI-native tools, agents, voice, open source">
  <!-- Transparent background + mid-tone grays keep the banner legible on both
       GitHub light and dark themes without needing a <picture> theme switch. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <style>
    .name {
      font: 700 68px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      letter-spacing: -1.5px;
    }
    .tagline {
      font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: #8b949e;
    }
    .topics {
      font: 500 15px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
  </style>

  <text x="480" y="92" text-anchor="middle" class="name" fill="url(#accent)">Kieran</text>
  <text x="480" y="138" text-anchor="middle" class="tagline">Build useful things. Share what works. Keep compounding.</text>

  <rect x="380" y="163" width="200" height="2.5" rx="1.25" fill="url(#accent)"/>

  <text x="480" y="200" text-anchor="middle" class="topics">agents&#160;&#160;&#183;&#160;&#160;voice&#160;&#160;&#183;&#160;&#160;developer tools&#160;&#160;&#183;&#160;&#160;open source</text>
</svg>
